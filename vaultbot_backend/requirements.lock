# ── Reproducible install lock ────────────────────────────────────────────────
# Pinned exact versions for reproducible installs. Generated via
# `pip freeze` against the working venv. requirements.txt is the
# human-edited source of truth (the >= bounds); this file is the
# reproducible install target that prevents the faiss/numpy ABI class
# of breakage.
#
# IMPORTANT: This lock was generated on Python 3.12. Some pins (numpy 2.5+)
# require Python >= 3.12. The setup scripts (setup.ps1 / setup.sh) will
# automatically fall back to requirements.txt on Python 3.11. If you
# regenerate this lock on a different Python version, update the version
# guard in the setup scripts.
#
# Regenerate after changing requirements.txt:
#   pip install -r requirements.txt
#   pip freeze > requirements.lock
#
# For hash-pinned installs (supply-chain hardening):
#   pip install -r requirements.txt
#   pip freeze --require-hashes > requirements.lock  # or use pip-tools
#
# Install for reproducible builds:
#   pip install -r requirements.lock
#
# NOTE: dev tools (ruff, pyright, pytest) are pinned here too so the dev
# environment is reproducible, but they are NOT required to run the
# backend. pyproject.toml [project.optional-dependencies].dev is the
# source for those; the versions below mirror it so a fresh clone gets matching tooling.

