# Pre-commit hooks for VaultBot.
# Install once with:
#   pre-commit install
# Then every commit auto-runs ruff + ruff-format.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0  # keep in sync with the ruff version in the venv
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format