# VaultBot CI â€” lint, type-check, and test on every PR + push to main.
#
# This is the single highest-leverage guard against "silent feature death":
# the 2026-07-30 audit found three features that had been dead for weeks
# because nothing ran automatically. CI catches the next one before it ships.
#
# The offline pytest suite is the base hard gate. Retrieval-affecting changes
# also run a live golden-gate job (service container + Ollama) as a hard gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-retrieval-changes:
    name: Detect retrieval-affecting changes
    runs-on: ubuntu-latest
    outputs:
      retrieval_changed: ${{ steps.detect.outputs.retrieval_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changed files for golden-gate scope
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-parents=0 "$head_sha" | tail -n1)"
          fi

          echo "Diff base: $base_sha"
          echo "Diff head: $head_sha"

          git diff --name-only "$base_sha" "$head_sha" > changed_files.txt
          cat changed_files.txt

          pattern='^(vaultbot_backend/(fused_retrieval\.py|vault_indexer\.py|vault_graph\.py|abstract_context\.py|weaving\.py|embedding_drift\.py|golden_eval\.py|golden_set\.json|run_golden_gate\.py|validate_golden_set\.py)|\.github/workflows/(golden-gate\.yml|ci\.yml))$'
          if grep -Eq "$pattern" changed_files.txt; then
            echo "retrieval_changed=true" >> "$GITHUB_OUTPUT"
            echo "Golden-gate scope changed: YES"
          else
            echo "retrieval_changed=false" >> "$GITHUB_OUTPUT"
            echo "Golden-gate scope changed: NO"
          fi

  lint-and-test:
    name: ruff + pyright + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # gitleaks-action posts review comments on PRs
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor (pyproject.toml target-version = py311).
        # 3.12 is the runtime version in the dev venv. 3.13 and 3.14 are
        # what python.org now installs by default on new machines, so they
        # are covered too — every version up to 3.14 is a hard gate.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks needs full history to scan for secrets across all
          # commits, not just the shallow tip.
          fetch-depth: 0

      - name: Verify setup.sh syntax (HARD GATE)
        # The macOS/Linux installer (setup.sh) was updated in #149 to match
        # the new layout, but its syntax was never verified — the dev
        # machine has no bash/WSL. A syntax error would silently break the
        # one-liner install for every macOS/Linux user. bash -n catches
        # parse errors without executing the script (issue #151).
        run: bash -n setup.sh

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked)
        # `uv sync --frozen` installs exactly what uv.lock pins — no
        # re-resolution, fully reproducible.  --extra dev pulls in the
        # [project.optional-dependencies].dev group (ruff, pyright,
        # pytest, httpx2, uv).
        run: uv sync --frozen --extra dev

      - name: Requirements lock synchronization (HARD GATE)
        run: uv run python vaultbot_backend/scripts/check_requirements_sync.py

      - name: "Ruff check â€” full rule set (HARD GATE)"
        # The full rule set (E, F, W, I, B, UP, SIM, RUF, BLE001, FAST) is
        # now a hard gate. The ~1500 violations of pre-existing style debt
        # were paid down in #51 and #54, so the tree is fully ruff-clean and
        # this gate now blocks any new violation from shipping.
        run: uv run ruff check vaultbot_backend/

      - name: Ruff format check (HARD GATE)
        # The codebase is fully formatted (220 files). Any formatting drift
        # now fails the build.
        run: uv run ruff format --check vaultbot_backend/

      - name: Baseline-marker check (HARD GATE)
        # Every committed .md under myvault/vaultbot-stuff/System/ must carry
        # "baseline: true" frontmatter. This is the same check the
        # pre-commit hook runs, but in --all mode it scans the whole
        # committed tree (CI has no staging area). Hard gate: the 11
        # files that predated the marker convention have been triaged
        # (all are shippable baseline procedures) and now carry the
        # marker. This gate enforces the baseline membrane — the safety
        # rail that keeps personal/bespoke content out of community PRs
        # and out of `git pull` updates (see issue #28).
        run: python vaultbot_backend/scripts/check_baseline_markers.py --all

      - name: Procedure-frontmatter check (HARD GATE)
        # Every committed procedure note (type: procedure in frontmatter)
        # must carry the full required frontmatter set — type, description,
        # when_to_use, allowed_tools, falsifiable_if, status,
        # created, summary, tags — and must not declare model_cartridge at
        # procedure level. Cartridge selection belongs to each step. This is the same gate
        # Procedure-Creator applies at publication time, enforced here so a
        # hand-edited or tool-bypassed procedure can't ship with incomplete
        # frontmatter and silently break RAG retrieval / subprocess
        # execution. Reuses procedure_validator (no duplicated logic).
        run: python vaultbot_backend/scripts/check_procedure_frontmatter.py --all

      - name: Procedure provenance/rationale check (HARD GATE)
        # Every committed procedure must carry provenance (sources/depends_on/
        # ## Related wikilinks) and a ## Why This Exists rationale section
        # (issues #63 + #64). Was a report-only soft gate while the ~200
        # pre-existing procedures were backfilled; the backfill is complete
        # (0 missing), so this now blocks any new procedure that ships
        # without provenance or rationale.
        run: python vaultbot_backend/scripts/check_procedure_provenance.py

      - name: Pyright (non-blocking â€" pre-existing debt, enforced later)
        # Non-blocking per Phase 2 decision in pyproject.toml. Reports type
        # errors as warnings so the team sees the debt but CI stays green.
        # Config is in pyproject.toml [tool.pyright].  Emit JSON so the debt
        # gate can compare counts without re-running the whole tool.
        run: |
          set +e
          uv run pyright --level warning --outputjson vaultbot_backend/ > pyright-report.json
        continue-on-error: true

      - name: Pyright — hot-path files (HARD GATE)
        # Enforce type-checking on the hot-path modules where a type error
        # is a real bug (mirrors the BLE001 hot-path strategy). Narrow scope
        # first so we don't drown in pre-existing debt; widen incrementally.
        #
        # vault_indexer.py, chat_handler.py, fused_retrieval.py, services.py,
        # and subprocess_utils.py are all clean (0 errors) and are the hard gate
        # today (issue #20). Target: flip full-repo pyright to blocking on 2026-10-01.
        run: uv run pyright --level error vaultbot_backend/vault_indexer.py vaultbot_backend/chat_handler.py vaultbot_backend/fused_retrieval.py vaultbot_backend/services.py vaultbot_backend/subprocess_utils.py

      - name: Pytest — unit tests (HARD GATE)
        # Pure-logic tests marked with `pytestmark = pytest.mark.unit`.
        # No I/O, no network, no Ollama, no FAISS.  These MUST pass —
        # no continue-on-error.  This is the gate that catches regressions
        # before they ship.
        working-directory: vaultbot_backend
        env:
          VAULTBOT_SKIP_LOCK: "1"
          VAULTBOT_SKIP_WATCHER: "1"
          VAULT_PATH: ${{ github.workspace }}/myvault
        run: |
          mkdir -p "$VAULT_PATH/vaultbot-stuff/Memory/Chat"
          mkdir -p "$VAULT_PATH/vaultbot-stuff/Knowledge"
          mkdir -p "$VAULT_PATH/vaultbot-stuff/System"
          uv run pytest -q -m "unit" --tb=short \
            --cov=vaultbot_backend --cov-report=term-missing \
            --cov-fail-under=15

      - name: Pytest — integration tests (soft gate)
        # Tests marked `pytestmark = pytest.mark.integration` — these need
        # FAISS or vault fixtures that may not be fully buildable in a
        # bare CI runner.  Soft gate: failures are reported but don't fail
        # the build.  Once fixtures are CI-ready, flip to a hard gate.
        # Write JUnit XML so the debt gate can compare counts without a second
        # pytest run.
        working-directory: vaultbot_backend
        env:
          VAULTBOT_SKIP_LOCK: "1"
          VAULTBOT_SKIP_WATCHER: "1"
          VAULT_PATH: ${{ github.workspace }}/myvault
        run: |
          set +e
          uv run pytest -q -m "integration" --tb=short --junitxml="${{ github.workspace }}/pytest-integration.xml"
        continue-on-error: true

      - name: Debt ratchet (HARD GATE)
        # The two soft gates above are reported with machine-readable artifacts in
        # the same run, so the ratchet compares counts without re-running either
        # tool. This keeps the baseline enforcement while removing the redundant
        # pyright x3 / pytest integration x2 behavior from CI.
        run: |
          uv run python vaultbot_backend/scripts/check_debt_ratchet.py \
            --pyright-json "$GITHUB_WORKSPACE/pyright-report.json" \
            --pytest-junitxml "$GITHUB_WORKSPACE/pytest-integration.xml"

      - name: Thinness ratchet (HARD GATE)
        # Measures inline backend .py logic (non-blank, non-comment lines in
        # vaultbot_backend/ excluding custom_tools/, tests/, scripts/) and
        # fails if it EXCEEDS the committed baseline in .ci-baseline.json.
        # This is the enforcement mechanism for the "thin backend" goal
        # (issue #150): logic should migrate out of inline .py modules into
        # procedures / custom_tools / a thin interpreter, and this ratchet
        # makes that migration monotonic — the count can only go down as we
        # thin. Lower the baseline in the same PR that thins the code.
        run: python vaultbot_backend/scripts/check_thinness.py

      - name: PowerShell BOM check (HARD GATE)
        # Windows PowerShell 5.1 mis-parses a .ps1 file that contains
        # non-ASCII characters (box-drawing, em-dashes) unless it starts
        # with a UTF-8 BOM. Enforces the conditional invariant: non-ASCII
        # .ps1 MUST have a BOM, pure-ASCII .ps1 MUST NOT. Catches the
        # regression where an edit tool strips the BOM from a Unicode
        # installer script.
        run: python vaultbot_backend/scripts/check_ps1_bom.py

      - name: Secret scan (gitleaks)
        # Hard gate: the backend now handles OAuth tokens (google_workspace).
        # gitleaks scans the whole repo for leaked secrets/credentials before
        # anything ships. No config needed — default rules cover common
        # credential formats.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency vulnerability audit (pip-audit)
        # Hard gate: fail if any pinned dependency has a known CVE.
        # Audits the concrete requirements.txt (the uv.lock-derived pip
        # fallback) rather than introspecting the uv-managed environment,
        # which pip-audit may silently skip. -r ensures every pinned
        # version is checked regardless of how the env was installed
        # (issue #179). --strict treats warnings as failures so a
        # dep that can't be looked up doesn't silently pass.
        run: |
          uv run pip-audit -r vaultbot_backend/requirements.txt --strict

  golden-gate-retrieval:
    name: Golden-gate retrieval run
    needs: detect-retrieval-changes
    if: needs.detect-retrieval-changes.outputs.retrieval_changed == 'true'
    runs-on: ubuntu-latest

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vaultbot_backend/requirements.txt

      - name: Cache Ollama nomic-embed-text model
        id: cache-model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ollama
          key: ollama-nomic-embed-text-1
          lookup-only: true

      - name: Pull nomic-embed-text (only if not cached)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama pull nomic-embed-text

      - name: Save Ollama model to cache
        if: steps.cache-model.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ollama
          key: ollama-nomic-embed-text-1

      - name: Confirm nomic-embed-text is available
        run: ollama list

      - name: Warm up embedding model
        run: |
          curl -s http://localhost:11434/api/embeddings -d '{"model":"nomic-embed-text","prompt":"warmup"}' > /dev/null
          echo "Embedding model warmed up."

      - name: Validate golden set against committed notes
        working-directory: vaultbot_backend
        run: |
          python validate_golden_set.py --repo-root "${{ github.workspace }}"

      - name: Build index + run golden gate
        working-directory: vaultbot_backend
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_EMBED_MODEL: nomic-embed-text
          VAULT_PATH: ${{ github.workspace }}/myvault
          VAULTBOT_SKIP_LOCK: "1"
          VAULTBOT_SKIP_WATCHER: "1"
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from vault_indexer import VaultIndexer
          idx = VaultIndexer(vault_path=os.environ['VAULT_PATH'])
          md = [str(p) for p in idx._collect_md_files()]
          if md:
            idx.batch_add_files(md)
          print(f'Indexed {len(md)} notes for golden-gate run.')
          "
          python run_golden_gate.py --vault "$VAULT_PATH" --min-recall 0.7 --k 5 --debug

  golden-gate-required:
    name: Golden-gate retrieval (HARD GATE)
    needs: [detect-retrieval-changes, golden-gate-retrieval]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce retrieval gate verdict
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.detect-retrieval-changes.result }}" != "success" ]]; then
            echo "Could not determine retrieval change scope."
            exit 1
          fi

          if [[ "${{ needs.detect-retrieval-changes.outputs.retrieval_changed }}" != "true" ]]; then
            echo "No retrieval-affecting changes detected; golden gate not required."
            exit 0
          fi

          if [[ "${{ needs.golden-gate-retrieval.result }}" != "success" ]]; then
            echo "Golden-gate retrieval failed or was cancelled."
            exit 1
          fi

          echo "Golden-gate retrieval passed."

  release:
    # Cut a GitHub release for every merge to main, tagged from the plugin
    # manifest version. The in-Obsidian updater targets the latest release
    # tag (not `main`), so a release is what makes "Update from GitHub" safe
    # for non-technical users: they move between known-good, CI-passed
    # releases instead of a moving branch (issue #280).
    #
    # If the tag already exists (version not bumped), this is a no-op.
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-test, golden-gate-required]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(python -c "import json;print(json.load(open('myvault/.obsidian/plugins/vaultbot/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
