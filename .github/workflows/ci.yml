# VaultBot CI â€” lint, type-check, and test on every PR + push to main.
#
# This is the single highest-leverage guard against "silent feature death":
# the 2026-07-30 audit found three features that had been dead for weeks
# because nothing ran automatically. CI catches the next one before it ships.
#
# The offline pytest suite is the hard gate. The live golden-gate (needs
# Ollama + a built index) runs in a separate workflow (golden-gate.yml)
# because it needs a service container.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pyright + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor (pyproject.toml target-version = py311).
        # 3.12 is the runtime version in the dev venv.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked)
        # `uv sync --frozen` installs exactly what uv.lock pins — no
        # re-resolution, fully reproducible.  --extra dev pulls in the
        # [project.optional-dependencies].dev group (ruff, pyright,
        # pytest, httpx2, uv).
        working-directory: vaultbot
        run: uv sync --frozen --extra dev

      - name: "Ruff check â€” hard gate (F-rules: real bugs only)"
        # Gate on F-rules only (undefined names, unused imports, etc.) â€”
        # these are real bugs, not style.  The remaining ~250 B/UP/SIM/RUF
        # violations are pre-existing style debt that needs an incremental
        # cleanup pass; they're reported as warnings in the next step.
        working-directory: vaultbot
        run: uv run ruff check --select F vaultbot_backend/

      - name: "Ruff check â€” soft gate (B, UP, SIM, RUF: style + correctness)"
        # Report bug-class + style violations.  Non-blocking so the team
        # sees the debt but CI doesn't fail on pre-existing issues.
        # Once the debt is paid down, flip this to a hard gate.
        working-directory: vaultbot
        run: uv run ruff check --select B,UP,SIM,RUF vaultbot_backend/
        continue-on-error: true

      - name: Ruff check â€” full rule set (non-blocking baseline)
        # Report ALL violations including style.  Non-blocking.
        working-directory: vaultbot
        run: uv run ruff check vaultbot_backend/
        continue-on-error: true

      - name: Ruff format check
        # Non-blocking: the codebase has pre-existing formatting drift
        # (dozens of files) unrelated to any PR. Report it so the team sees
        # the debt, but don't fail the build on it — same treatment as the
        # pyright and full-rule-set steps. Flip to a hard gate once the
        # drift is paid down.
        working-directory: vaultbot
        run: uv run ruff format --check vaultbot_backend/
        continue-on-error: true

      - name: Baseline-marker check (soft gate)
        # Every committed .md under vaultbot/System/ should carry
        # "baseline: true" frontmatter. This is the same check the
        # pre-commit hook runs, but in --all mode it scans the whole
        # committed tree (CI has no staging area). Soft gate: 13 files
        # predate the marker convention and need a human decision on
        # whether they're shippable baseline or personal/bespoke. Flip to
        # a hard gate once that triage is done.
        run: python vaultbot/vaultbot_backend/scripts/check_baseline_markers.py --all
        continue-on-error: true

      - name: Pyright (non-blocking â€” pre-existing debt, enforced later)
        # Non-blocking per Phase 2 decision in pyproject.toml. Reports type
        # errors as warnings so the team sees the debt but CI stays green.
        # Config is in pyproject.toml [tool.pyright].
        working-directory: vaultbot
        run: uv run pyright --level warning vaultbot_backend/
        continue-on-error: true

      - name: Pyright — hot-path files (HARD GATE)
        # Enforce type-checking on the hot-path modules where a type error
        # is a real bug (mirrors the BLE001 hot-path strategy). Narrow scope
        # first so we don't drown in pre-existing debt; widen incrementally.
        #
        # vault_indexer.py is clean (0 errors) and is the hard gate today.
        # chat_handler.py (4 errors: dynamic WebSocket attrs) and
        # fused_retrieval.py (8 errors: Any|None handling) have pre-existing
        # debt — fix those, then add them to this list.
        working-directory: vaultbot
        run: uv run pyright --level error vaultbot_backend/vault_indexer.py

      - name: Pytest — unit tests (HARD GATE)
        # Pure-logic tests marked with `pytestmark = pytest.mark.unit`.
        # No I/O, no network, no Ollama, no FAISS.  These MUST pass —
        # no continue-on-error.  This is the gate that catches regressions
        # before they ship.
        working-directory: vaultbot/vaultbot_backend
        env:
          VAULTBOT_SKIP_LOCK: "1"
          VAULTBOT_SKIP_WATCHER: "1"
          VAULT_PATH: ${{ github.workspace }}
        run: |
          mkdir -p "$VAULT_PATH/vaultbot/Memory/Chat"
          mkdir -p "$VAULT_PATH/vaultbot/Knowledge"
          mkdir -p "$VAULT_PATH/vaultbot/System"
          uv run pytest -q -m "unit" --tb=short \
            --cov=vaultbot_backend --cov-report=term-missing \
            --cov-fail-under=10

      - name: Pytest — integration tests (soft gate)
        # Tests marked `pytestmark = pytest.mark.integration` — these need
        # FAISS or vault fixtures that may not be fully buildable in a
        # bare CI runner.  Soft gate: failures are reported but don't fail
        # the build.  Once fixtures are CI-ready, flip to a hard gate.
        working-directory: vaultbot/vaultbot_backend
        env:
          VAULTBOT_SKIP_LOCK: "1"
          VAULTBOT_SKIP_WATCHER: "1"
          VAULT_PATH: ${{ github.workspace }}
        run: |
          uv run pytest -q -m "integration" --tb=short
        continue-on-error: true

      - name: Secret scan (gitleaks)
        # Hard gate: the backend now handles OAuth tokens (google_workspace).
        # gitleaks scans the whole repo for leaked secrets/credentials before
        # anything ships. No config needed — default rules cover common
        # credential formats.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency vulnerability audit (pip-audit)
        # Hard gate: fail if any pinned dependency has a known CVE. Runs
        # against the locked environment so it reflects exactly what ships.
        working-directory: vaultbot
        run: |
          uv run pip-audit