# Live golden-set retrieval gate â€” scores the REAL fused retriever against
# golden_set.json using a service container running Ollama + nomic-embed-text.
#
# Runs on manual dispatch for ad-hoc diagnostics. The blocking PR/push gate
# now lives in the main CI workflow, where it is enforced as a hard gate
# for retrieval-affecting changes.
#
# The Ollama model (~270 MB) is cached in the Actions cache so only the
# first run downloads it.
name: Golden-gate retrieval

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-gate:
    name: recall@5 ≥ 0.7 against expanded golden set
    runs-on: ubuntu-latest

    # Ollama service container â€” exposes 11434 to the job container.
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vaultbot_backend/requirements.txt

      - name: Cache Ollama nomic-embed-text model
        id: cache-model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ollama
          key: ollama-nomic-embed-text-1
          lookup-only: true

      - name: Pull nomic-embed-text (only if not cached)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama pull nomic-embed-text

      - name: Save Ollama model to cache
        if: steps.cache-model.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ollama
          key: ollama-nomic-embed-text-1

      - name: Confirm nomic-embed-text is available
        run: ollama list

      - name: Warm up embedding model
        # Force nomic-embed-text to load into memory BEFORE the seed-index
        # fires 8 concurrent embedding requests. Without this, the first
        # batch races the model load and some requests return empty
        # embeddings (the "Skipping X: received empty embedding from Ollama"
        # warnings that skip files from the index).
        run: |
          curl -s http://localhost:11434/api/embeddings -d '{"model":"nomic-embed-text","prompt":"warmup"}' > /dev/null
          echo "Embedding model warmed up."

      - name: Validate golden set against committed notes
        working-directory: vaultbot_backend
        run: |
          python validate_golden_set.py --repo-root "${{ github.workspace }}"

      - name: Build index + run golden gate
        working-directory: vaultbot_backend
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_EMBED_MODEL: nomic-embed-text
          VAULT_PATH: ${{ github.workspace }}/myvault
          VAULTBOT_SKIP_LOCK: "1"
          VAULTBOT_SKIP_WATCHER: "1"
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from vault_indexer import VaultIndexer
          idx = VaultIndexer(vault_path=os.environ['VAULT_PATH'])
          # Seed-index ALL vault markdown. The golden set spans root
          # directives, Knowledge/, System/Procedures/, and baseline/, so a
          # narrow filter (e.g. only 'baseline'/'directive' paths) misses most
          # expected notes. Use the indexer's own collector so the canonical
          # ignore rules (_is_ignored_path) apply — this is the same file set
          # the real indexer would index.
          md = [str(p) for p in idx._collect_md_files()]
          if md:
            idx.batch_add_files(md)
          print(f'Indexed {len(md)} notes for golden-gate run.')
          "
          python run_golden_gate.py --vault "$VAULT_PATH" --min-recall 0.7 --k 5 --debug