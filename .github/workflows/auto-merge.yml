# Auto-merge for routine, low-risk PRs.
#
# Two classes of PR are auto-merged (once CI is green AND the required
# @Ziggibot0 code-owner review is satisfied — auto-merge does NOT bypass
# the approval gate, it only removes the manual "click merge" step):
#
#   1. Dependabot PRs that are patch or minor bumps. Major bumps stay
#      manual because they can carry breaking changes that need a human
#      judgment call (issue #229's "no silent fallbacks" spirit).
#   2. Bot-authored PRs (ziggibot-uni) — the vaultbot's own contributions.
#      These are code changes, so they still require the human approval,
#      but once approved they merge themselves instead of waiting for a
#      second manual step.
#
# `gh pr merge --auto` enables GitHub's native auto-merge: the PR merges
# the moment every branch-protection requirement (required reviews +
# required status checks) passes. If a requirement is unmet, the PR simply
# stays open — nothing is force-merged.
name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge (patch/minor + bot PRs)
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      (github.actor == 'dependabot[bot]' || github.actor == 'ziggibot-uni')
    steps:
      - name: Dependabot metadata
        id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        # For dependabot: only patch/minor. For bot PRs: always (approval
        # is still the gate). Major dependabot bumps fall through and stay
        # fully manual.
        if: |
          github.actor != 'dependabot[bot]' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
