name: Label bootstrap

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly Monday 04:00 UTC

permissions:
  issues: write

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update operational labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const labels = [
              {
                name: "trivial",
                color: "0E8A16",
                description: "High-confidence low-complexity issue suitable for autonomous handling"
              },
              {
                name: "copilot-candidate",
                color: "1D76DB",
                description: "Issue is a candidate for Copilot cloud agent delegation"
              },
              {
                name: "no-auto-triage",
                color: "B60205",
                description: "Exclude this issue from automatic labeling and assignment"
              },
              {
                name: "qa-scout",
                color: "5319E7",
                description: "Tracking issue opened by QA scout workflow"
              },
              {
                name: "vulnerability-radar",
                color: "D93F0B",
                description: "Tracking issue opened by dependency vulnerability radar"
              },
              // ── PR scope labels (used by pr-labeler and release-drafter) ──
              {
                name: "backend",
                color: "0052CC",
                description: "Changes to vaultbot_backend/ Python code"
              },
              {
                name: "plugin",
                color: "006B75",
                description: "Changes to the Obsidian plugin"
              },
              {
                name: "procedures",
                color: "BFD4F2",
                description: "Changes to vault procedures or System notes"
              },
              {
                name: "ci",
                color: "F9D0C4",
                description: "Changes to CI/CD workflows or GitHub configuration"
              },
              {
                name: "documentation",
                color: "0075CA",
                description: "Documentation changes (README, CONTRIBUTING, etc.)"
              },
              {
                name: "security",
                color: "E11D48",
                description: "Security-related changes or fixes"
              },
              // ── Release-drafter semver labels ──────────────────────────────
              {
                name: "breaking-change",
                color: "B60205",
                description: "Introduces a breaking change (bumps major version)"
              },
              {
                name: "feature",
                color: "84B6EB",
                description: "New feature or capability"
              },
              {
                name: "enhancement",
                color: "A2EEEF",
                description: "Improvement to an existing feature"
              },
              {
                name: "bug",
                color: "D73A4A",
                description: "Something isn't working as expected"
              },
              {
                name: "fix",
                color: "E4E669",
                description: "A targeted bug fix"
              },
              {
                name: "chore",
                color: "E0E0E0",
                description: "Maintenance work with no user-visible behavior change"
              },
              {
                name: "maintenance",
                color: "EEEEEE",
                description: "Infrastructure, refactoring, or housekeeping"
              },
              {
                name: "stale",
                color: "CCCCCC",
                description: "Issue or PR has been idle and is pending close"
              }
            ];

            for (const l of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: l.name,
                });

                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: l.name,
                  new_name: l.name,
                  color: l.color,
                  description: l.description,
                });
                core.info(`Updated label: ${l.name}`);
              } catch (err) {
                if (err.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: l.name,
                    color: l.color,
                    description: l.description,
                  });
                  core.info(`Created label: ${l.name}`);
                } else {
                  throw err;
                }
              }
            }
