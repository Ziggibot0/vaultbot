# Release drafter configuration (issue #331).
#
# Automatically drafts the next release notes from PR labels as PRs merge
# to main. The maintainer reviews and publishes the draft when cutting a
# release (see CONTRIBUTING.md §"Releases").
#
# Labels used by auto-labeler (see labels-bootstrap.yml for the full label set):
#   breaking-change → 💥 Breaking
#   feature, enhancement → 🚀 Features
#   bug, fix → 🐛 Bug Fixes
#   security → 🔒 Security
#   dependencies → 📦 Dependencies
#   documentation → 📖 Documentation
#   chore, ci, maintenance → 🔧 Maintenance
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "💥 Breaking Changes"
    labels:
      - "breaking-change"
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "bug"
      - "fix"
  - title: "🔒 Security"
    labels:
      - "security"
  - title: "📦 Dependencies"
    labels:
      - "dependencies"
  - title: "📖 Documentation"
    labels:
      - "documentation"
  - title: "🔧 Maintenance"
    labels:
      - "chore"
      - "ci"
      - "maintenance"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - "breaking-change"
  minor:
    labels:
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "bug"
      - "fix"
      - "security"
      - "dependencies"
      - "documentation"
      - "chore"
      - "ci"
      - "maintenance"
  default: patch
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
