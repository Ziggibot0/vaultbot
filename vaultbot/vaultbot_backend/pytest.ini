[pytest]
testpaths = tests
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: pure logic tests — no I/O, no network, no Ollama, no FAISS. Always gate CI.
    integration: tests needing FAISS index or vault fixtures. Can build fixtures in CI.
    ollama: tests needing a live Ollama instance. Skip in base CI, run in golden-gate workflow.
    endpoints: tests needing the FastAPI app (uses __allows_main_import__ opt-in).